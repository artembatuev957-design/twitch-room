<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уютный стрим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--wood:#2a1d12;--cream:#f3e3c3;--amber:#e8a24a;--live:#ff4b4b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--cream);font-family:'Nunito',system-ui,sans-serif}
button,input{font:inherit}

/* стартовый экран */
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:10;transition:opacity .7s}
#start label{font-size:clamp(18px,3.2vw,26px);font-weight:700}
#start input{width:min(560px,90vw);padding:14px 18px;border-radius:10px;border:2px solid #4a3622;background:#0b0907;color:var(--cream);font-size:18px;outline:none;text-align:center}
#start input:focus{border-color:var(--amber)}
#start small{opacity:.55;font-size:14px}
#warn{max-width:560px;padding:10px 14px;border:2px solid #b8742a;border-radius:10px;color:#ffd9a8;font-size:14px;line-height:1.4}
#err{color:#ff8a7a;min-height:1.2em;font-size:15px}
#welcome{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;font-size:clamp(28px,6vw,56px);font-weight:800;z-index:11;opacity:0;transition:opacity .6s}
#welcome.show{opacity:1}

/* комната */
#room{display:none;min-height:100%;background:#1a120b;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:center;padding:10px 16px;background:var(--wood);border-bottom:2px solid #4a3622}
#bar label{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
#bar input[type=range]{width:clamp(110px,20vw,200px);accent-color:var(--amber)}
#bar button{background:transparent;color:var(--cream);border:2px solid #6b4f33;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:700}
#bar button:hover,#bar button:focus-visible{border-color:var(--amber);outline:none}
#scroll{overflow-x:auto;flex:1;display:flex;align-items:flex-start;justify-content:center}

<body>

<form id="start" autocomplete="off">
  <label for="url">Вставьте ссылку на стрим на Твиче</label>
  <input id="url" placeholder="https://twitch.tv/канал" autofocus spellcheck="false">
  <div id="err" role="alert"></div>
  <small>Нажмите Enter</small>
  <div id="warn" hidden>Файл открыт прямо с диска, поэтому Twitch не покажет плеер и чат («не позволяет установить соединение»). Запустите через localhost или выложите на хостинг, например GitHub Pages.</div>
</form>
<div id="welcome">Приятного просмотра</div>

<div id="room">
  <div id="bar">
    <label>Громкость <input id="vol" type="range" min="0" max="100" value="60"></label>
    <label>Яркость <input id="bri" type="range" min="20" max="150" value="100"></label>
    <button id="change" type="button">Сменить стрим</button>
  </div>
  <div id="scroll">
    <div id="scene">
      <div id="screens">
        <div class="scr" id="main"><div id="player"></div></div>
        <div class="scr" id="chat"></div>
      </div>
      <div id="sign"><span id="dot"></span><span id="online">Не в эфире</span></div>
    </div>
  </div>
</div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  if(location.protocol==='file:') $('warn').hidden=false;
  var host=location.hostname||'localhost', channel='', player=null, timer=null;

  function parse(v){
    v=(v||'').trim();
    var m=v.match(/twitch\.tv\/(?:popout\/)?([A-Za-z0-9_]{3,25})/i);
    if(m) return m[1].toLowerCase();
    if(/^[A-Za-z0-9_]{3,25}$/.test(v)) return v.toLowerCase();
    return '';
  }

  $('start').addEventListener('submit',function(e){
    e.preventDefault();
    var c=parse($('url').value);
    if(!c){ $('err').textContent='Не похоже на ссылку Twitch. Пример: https://twitch.tv/shroud'; return; }
    $('err').textContent=''; channel=c;
    $('start').style.opacity=0;
    var w=$('welcome'); w.style.display='flex';
    requestAnimationFrame(function(){w.classList.add('show')});
    setTimeout(function(){
      $('start').style.display='none';
      $('room').style.display='flex';
      buildRoom();
      w.classList.remove('show');
      setTimeout(function(){w.style.display='none'},700);
    },1800);
  });

  function buildRoom(){
    var pl=$('player'); pl.innerHTML=''; player=null;
    if(window.Twitch&&Twitch.Player){
      player=new Twitch.Player('player',{channel:channel,parent:[host],width:'100%',height:'100%',autoplay:true,muted:false});
      player.addEventListener(Twitch.Player.READY,function(){applyVol()});
    }else{
      pl.innerHTML='<iframe allowfullscreen allow="autoplay;fullscreen" src="https://player.twitch.tv/?channel='+channel+'&parent='+host+'&muted=false"></iframe>';
    }
    $('chat').innerHTML='<iframe src="https://www.twitch.tv/embed/'+channel+'/chat?parent='+host+'&darkpopout"></iframe>';
    pollOnline(); clearInterval(timer); timer=setInterval(pollOnline,30000);
  }

  function applyVol(){
    if(!player) return;
    try{ player.setMuted(false); player.setVolume($('vol').value/100); }catch(e){}
  }
  $('vol').addEventListener('input',applyVol);
  $('bri').addEventListener('input',function(){ $('screens').style.filter='brightness('+(this.value/100)+')'; });

  function pollOnline(){
    var s=$('sign'), t=$('online'), ch=channel;
    fetch('https://decapi.me/twitch/viewercount/'+ch).then(function(r){return r.text()}).then(function(txt){
      if(ch!==channel) return;
      var n=parseInt(txt.trim(),10);
      if(!isNaN(n)&&/^\d+$/.test(txt.trim())){ s.classList.add('on'); t.textContent='В эфире: '+n.toLocaleString('ru-RU')+' зрителей'; }
      else { s.classList.remove('on'); t.textContent='Не в эфире'; }
    }).catch(function(){ s.classList.remove('on'); t.textContent='Онлайн недоступен'; });
  }

  $('change').addEventListener('click',function(){
    clearInterval(timer);
    $('room').style.display='none'; $('player').innerHTML=''; $('chat').innerHTML='';
    var st=$('start'); st.style.display='flex'; $('url').value='';
    requestAnimationFrame(function(){st.style.opacity=1; $('url').focus();});
  });
})();
</script>
</body>
</html>
