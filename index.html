<title>Уютный стрим</title>

<style>
:root{--wood:#2a1d12;--cream:#f3e3c3;--amber:#e8a24a;--live:#ff4b4b;--bar:56px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--cream);font-family:'Nunito',system-ui,sans-serif}
button,input{font:inherit}

/* стартовый экран */
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:10;transition:opacity .7s}
#start h1{font-size:clamp(22px,4vw,34px);font-weight:800;color:var(--amber)}
#start label{font-size:clamp(16px,2.6vw,22px);font-weight:700}
.row{display:flex;gap:10px;width:min(620px,92vw)}
#start input{flex:1;min-width:0;padding:14px 18px;border-radius:10px;border:2px solid #4a3622;background:#0b0907;color:var(--cream);font-size:18px;outline:none;text-align:center}
#start input:focus{border-color:var(--amber)}
#go{padding:0 22px;border-radius:10px;border:2px solid var(--amber);background:var(--amber);color:#2a1d12;font-weight:800;cursor:pointer}
#go:hover,#go:focus-visible{filter:brightness(1.1);outline:none}
#recent{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#recent button{background:transparent;color:var(--cream);border:2px solid #4a3622;border-radius:999px;padding:4px 14px;cursor:pointer;font-weight:700;font-size:14px}
#recent button:hover,#recent button:focus-visible{border-color:var(--amber);outline:none}
#start small{opacity:.55;font-size:14px}
#warn{max-width:560px;padding:10px 14px;border:2px solid #b8742a;border-radius:10px;color:#ffd9a8;font-size:14px;line-height:1.4}
#err{color:#ff8a7a;min-height:1.2em;font-size:15px}
#welcome{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;font-size:clamp(28px,6vw,56px);font-weight:800;z-index:11;opacity:0;transition:opacity .6s}
#welcome.show{opacity:1}

/* комната: панель сверху остаётся и в полноэкранном режиме */
#room{display:none;height:100vh;height:100dvh;background:#1a120b;flex-direction:column;overflow:hidden}
#bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;padding:10px 16px;background:var(--wood);border-bottom:2px solid #4a3622;flex:none}
#bar button{background:transparent;color:var(--cream);border:2px solid #6b4f33;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:700}
#bar button:hover,#bar button:focus-visible{border-color:var(--amber);outline:none}
#unmute{display:none;border-color:var(--amber)!important;color:var(--amber)!important}

/* переключатель день / ночь */
#theme{display:flex!important;align-items:center;gap:8px;padding:3px 6px 3px 10px!important}
#theme .track{position:relative;width:46px;height:24px;border-radius:999px;background:#6b4f33;transition:background .3s}
#theme .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#ffd98a;transition:transform .3s,background .3s}
#theme[aria-checked="true"] .track{background:#2e3a63}
#theme[aria-checked="true"] .knob{transform:translateX(22px);background:#cfd8ff}

#scroll{flex:1;min-height:0;display:flex;overflow:auto}
#scene{position:relative;flex:none;margin:0 auto;container-type:inline-size;
  width:min(100%,calc((100vh - var(--bar))*1408/768));
  width:min(100%,calc((100dvh - var(--bar))*1408/768));
  min-width:900px;aspect-ratio:1408/768;overflow:hidden}
.bg{position:absolute;inset:0;background:center/100% 100% no-repeat;transition:opacity .8s}

#scene.night #time{color:#bfd0ff;text-shadow:0 0 1cqw #7f96ffbb,0 0 .2cqw #e6ecff}
#scene.night #date{color:#9fb0e0}

@media (prefers-reduced-motion:reduce){#sign.on #dot,#colon{animation:none}#start,#welcome,.bg{transition:none}}
@media (max-width:600px){.row{flex-direction:column}#go{padding:12px}}

<body>

<form id="start" autocomplete="off">
  <h1>☕ Уютный стрим</h1>
  <label for="url">Вставьте ссылку на стрим на Твиче</label>
  <div class="row">
    <input id="url" placeholder="https://twitch.tv/канал" autofocus spellcheck="false" inputmode="url">
    <button id="go" type="submit">Войти</button>
  </div>
  <div id="err" role="alert"></div>
  <div id="recent" aria-label="Недавние каналы"></div>
  <small>Нажмите Enter</small>
  <div id="warn" hidden>Файл открыт прямо с диска, поэтому Twitch не покажет плеер и чат («не позволяет установить соединение»). Запустите через localhost или выложите на хостинг, например GitHub Pages.</div>
</form>
<div id="welcome">Приятного просмотра</div>

<div id="room">
  <div id="bar">
    <button id="unmute" type="button">🔇 Включить звук</button>
    <button id="theme" type="button" role="switch" aria-checked="false" aria-label="Ночь">
      <span aria-hidden="true">☀️</span><span class="track"><span class="knob"></span></span><span aria-hidden="true">🌙</span>
    </button>
    <button id="fs" type="button">На весь экран</button>
    <button id="change" type="button">Сменить стрим</button>
  </div>
  <div id="scroll">
    <div id="scene">
      <div class="bg" id="bgDay"></div>
      <div class="bg" id="bgNight"></div>
      <div id="screens">
        <div class="scr" id="main"><div id="player"></div></div>
        <div class="scr" id="chat"></div>
      </div>
      <div id="sign"><span id="dot"></span><span id="online">Подключаемся…</span></div>
      <div id="clock" aria-label="Часы">
        <div id="time"><span id="hh">00</span><span id="colon">:</span><span id="mm">00</span><span id="ss">00</span></div>
        <div id="date"></div>
      </div>
    </div>
  </div>
</div>

<noscript><p style="position:fixed;inset:0;background:#000;display:grid;place-items:center">Нужен включённый JavaScript.</p></noscript>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  if(location.protocol==='file:') $('warn').hidden=false;
  var host=location.hostname||'localhost', channel='', player=null;
  var KEY='cozy-stream';

  /* localStorage может быть недоступен (приватный режим) */
  function load(k,d){try{var v=localStorage.getItem(KEY+':'+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v))}catch(e){}}

  function parse(v){
    v=(v||'').trim();
    var m=v.match(/twitch\.tv\/(?:popout\/)?([A-Za-z0-9_]{3,25})/i);
    if(m) return m[1].toLowerCase();
    if(/^@?[A-Za-z0-9_]{3,25}$/.test(v)) return v.replace('@','').toLowerCase();
    return '';
  }

  /* ---------- день / ночь ---------- */
  var night=load('night',null);
  if(night===null){ var h=new Date().getHours(); night=(h>=19||h<7); }  /* по умолчанию — по времени суток */
  function applyTheme(){
    $('scene').classList.toggle('night',night);
    $('theme').setAttribute('aria-checked',night?'true':'false');
    $('theme').setAttribute('aria-label',night?'Ночь':'День');
  }
  applyTheme();
  $('theme').addEventListener('click',function(){ night=!night; save('night',night); applyTheme(); });

  /* ---------- часы ---------- */
  var days=['вс','пн','вт','ср','чт','пт','сб'];
  var months=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  function two(n){return (n<10?'0':'')+n}
  function tick(){
    var d=new Date();
    $('hh').textContent=two(d.getHours()); $('mm').textContent=two(d.getMinutes()); $('ss').textContent=two(d.getSeconds());
    $('date').textContent=days[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()];
  }
  tick(); setInterval(tick,1000);

  /* ---------- стартовый экран ---------- */
  function renderRecent(){
    var list=load('recent',[]), box=$('recent'); box.innerHTML='';
    list.forEach(function(c){
      var b=document.createElement('button'); b.type='button'; b.textContent=c;
      b.addEventListener('click',function(){$('url').value=c; enter(c)});
      box.appendChild(b);
    });
  }
  renderRecent();

  function enter(c){
    channel=c;
    var list=load('recent',[]).filter(function(x){return x!==c}); list.unshift(c); save('recent',list.slice(0,4));
    var u=new URL(location.href); u.searchParams.set('channel',c); try{history.replaceState(null,'',u)}catch(e){}
    $('start').style.opacity=0;
    var w=$('welcome'); w.style.display='flex';
    requestAnimationFrame(function(){w.classList.add('show')});
    setTimeout(function(){
      $('start').style.display='none';
      $('room').style.display='flex';
      fitBar();
      buildRoom();
      w.classList.remove('show');
      setTimeout(function(){w.style.display='none'},700);
    },1500);
  }

  $('start').addEventListener('submit',function(e){
    e.preventDefault();
    var c=parse($('url').value);
    if(!c){ $('err').textContent='Не похоже на ссылку Twitch. Пример: https://twitch.tv/shroud'; return; }
    $('err').textContent=''; enter(c);
  });

  /* высота панели нужна, чтобы комната целиком помещалась под ней */
  function fitBar(){ document.documentElement.style.setProperty('--bar',$('bar').offsetHeight+'px'); }
  window.addEventListener('resize',fitBar);

  /* ---------- плеер и чат ---------- */
  function setSign(on,text){
    $('sign').classList.toggle('on',on); $('online').textContent=text;
  }

  function buildRoom(){
    var pl=$('player'); pl.innerHTML=''; player=null;
    setSign(false,'Подключаемся…'); $('unmute').style.display='none';
    if(window.Twitch&&Twitch.Player){
      /* стартуем без звука: браузеры надёжно разрешают такой автозапуск, дальше пробуем включить звук.
         Громкость плеера на максимуме, регулировать её нужно на самом компьютере. */
      player=new Twitch.Player('player',{channel:channel,parent:[host],width:'100%',height:'100%',autoplay:true,muted:true});
      player.addEventListener(Twitch.Player.READY,function(){ try{player.setVolume(1)}catch(e){} tryUnmute(); });
      player.addEventListener(Twitch.Player.ONLINE,function(){ setSign(true,'В эфире'); });
      player.addEventListener(Twitch.Player.OFFLINE,function(){ setSign(false,'Не в эфире'); });
      player.addEventListener(Twitch.Player.PLAYING,function(){ checkMuted(); });
    }else{
      pl.innerHTML='<iframe allowfullscreen allow="autoplay;fullscreen" src="https://player.twitch.tv/?channel='+channel+'&parent='+host+'&muted=true"></iframe>';
      setSign(false,'Плеер недоступен');
    }
    $('chat').innerHTML='<iframe title="Чат" src="https://www.twitch.tv/embed/'+channel+'/chat?parent='+host+'&darkpopout"></iframe>';
  }

  function tryUnmute(){
    if(!player) return;
    try{ player.setMuted(false); }catch(e){}
    setTimeout(checkMuted,800);
  }
  function checkMuted(){
    if(!player) return;
    try{ $('unmute').style.display=player.getMuted()?'inline-block':'none'; }catch(e){}
    fitBar();
  }
  $('unmute').addEventListener('click',function(){ if(!player) return; try{player.setMuted(false); player.setVolume(1);}catch(e){} checkMuted(); });

  /* ---------- весь экран: разворачиваем всю комнату вместе с панелью ---------- */
  var fs=$('fs');
  if(!$('room').requestFullscreen) fs.style.display='none';
  fs.addEventListener('click',function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else $('room').requestFullscreen().catch(function(){});
  });
  document.addEventListener('fullscreenchange',function(){
    fs.textContent=document.fullscreenElement?'Выйти из полного экрана':'На весь экран';
    fitBar();
  });

  $('change').addEventListener('click',function(){
    if(document.fullscreenElement) document.exitFullscreen();
    $('room').style.display='none'; $('player').innerHTML=''; $('chat').innerHTML=''; player=null;
    var st=$('start'); st.style.display='flex'; $('url').value=''; renderRecent();
    requestAnimationFrame(function(){st.style.opacity=1; $('url').focus();});
  });

  /* ссылка вида ?channel=ник открывает комнату сразу */
  var q=parse(new URLSearchParams(location.search).get('channel'));
  if(q){ $('url').value=q; enter(q); }
})();
</script>
</body>
</html>
